<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkBuddy Trace 统计</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
  --row:#f9fafb; --accent:#2f6fed; --green:#0f9d58; --purple:#7c3aed; --orange:#d97706;
  --shadow:0 1px 3px rgba(0,0,0,.06);
}
[data-theme="dark"]{
  --bg:#111827; --panel:#1f2937; --text:#e5e7eb; --muted:#9ca3af; --border:#374151;
  --row:#273244; --accent:#60a5fa; --green:#34d399; --purple:#a78bfa; --orange:#fbbf24;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;padding:26px 30px 60px;background:var(--bg);color:var(--text);
     font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.wrap{max-width:1500px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:23px;margin:0 0 6px}
h2{font-size:16px;margin:0}
.meta{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;color:var(--text);background:var(--panel);
       border:1px solid var(--border);border-radius:7px;padding:7px 12px}
button:hover{border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.card .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.card .v{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
       padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.controls{display:flex;gap:16px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--border);padding:5px 11px;font-size:12px;background:var(--panel)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chartbox{position:relative;max-height:430px;overflow:auto}
.chart{width:100%;height:auto;display:block;overflow:visible}
.ax{fill:var(--muted);font-size:11px}
.rowlab{fill:var(--text);font-size:15px}
.rowval{fill:var(--muted);font-size:15px}
.dot{fill:var(--accent);stroke:var(--panel);stroke-width:1.6}
.tip{position:absolute;display:none;background:var(--text);color:var(--panel);padding:6px 10px;
     border-radius:6px;font-size:12px;white-space:nowrap;transform:translate(-50%,-145%);pointer-events:none;z-index:5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.search{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:7px;padding:6px 10px;font:inherit;font-size:12px;width:190px}
.tablewrap{max-height:380px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{background:var(--row);color:var(--muted);font-weight:600;position:sticky;top:0;cursor:pointer;user-select:none;z-index:1}
th:hover{color:var(--accent)}
th .sort{font-size:9px;margin-left:3px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--row)}
.tfoot{color:var(--muted);font-size:12px;margin-top:9px}
.lnk{background:none;border:0;color:var(--accent);padding:0;font-size:12px;text-decoration:underline}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{color:var(--muted);padding:14px 0}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>WorkBuddy Trace 统计</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="toolbar">
      <button id="themeBtn">深色模式</button>
      <button id="exportAllBtn">导出每日明细 CSV</button>
    </div>
  </header>

  <section class="cards" id="cards"></section>

  <section class="panel">
    <div class="phead">
      <h2>使用趋势</h2>
      <div class="controls">
        <div class="seg" id="metricSeg"></div>
        <div class="seg" id="rangeSeg"></div>
      </div>
    </div>
    <div id="lineChart" class="chartbox"></div>
  </section>

  <div class="grid2">
    <section class="panel">
      <div class="phead"><h2>模型对比</h2><div class="seg" id="modelSeg"></div></div>
      <div id="modelChart" class="chartbox"></div>
    </section>
    <section class="panel">
      <div class="phead"><h2>Span 耗时 TOP 15</h2></div>
      <div id="spanChart" class="chartbox"></div>
      <p class="note">span 累计耗时，存在父子嵌套，不等于互斥时长。</p>
    </section>
  </div>

  <section class="panel">
    <div class="phead"><h2>按模型明细</h2><input class="search" id="modelSearch" placeholder="搜索模型…（点列名排序）"></div>
    <div id="modelTable"></div>
  </section>
  <section class="panel">
    <div class="phead"><h2>Span 耗时明细</h2><input class="search" id="spanSearch" placeholder="搜索 span…"></div>
    <div id="spanTable"></div>
  </section>
  <section class="panel">
    <div class="phead"><h2>每日明细</h2><input class="search" id="daySearch" placeholder="搜索日期…"></div>
    <div id="dayTable"></div>
  </section>
  <section class="panel">
    <div class="phead"><h2>最近会话</h2><input class="search" id="sessionSearch" placeholder="搜索时间…"></div>
    <div id="sessionTable"></div>
  </section>
</div>

<script id="report-data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('report-data').textContent);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtNum = n => Number(n || 0).toLocaleString('en-US');
function fmtDur(ms){
  ms = Number(ms || 0);
  if(ms >= 3600000) return (ms / 3600000).toFixed(1) + 'h';
  if(ms >= 60000) return (ms / 60000).toFixed(1) + 'm';
  if(ms >= 1000) return (ms / 1000).toFixed(1) + 's';
  return ms + 'ms';
}
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

const savedTheme = localStorage.getItem('wb-stats-theme') || 'light';
document.documentElement.dataset.theme = savedTheme;
$('#themeBtn').textContent = savedTheme === 'light' ? '深色模式' : '浅色模式';
$('#themeBtn').onclick = () => {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  localStorage.setItem('wb-stats-theme', t);
  $('#themeBtn').textContent = t === 'light' ? '深色模式' : '浅色模式';
  drawCharts();
};

$('#meta').textContent = `扫描 ${fmtNum(DATA.file_count)} 个 trace 文件 · 解析异常 ${fmtNum(DATA.malformed)} 行 · 生成于 ${DATA.generated_at}`;

const t = DATA.totals;
const cacheRate = t.prompt ? (t.cached / t.prompt * 100).toFixed(1) + '%' : '0%';
const tps = v => v.duration > 0 ? (v.completion / (v.duration / 1000)).toFixed(1) : '-';
const cards = [
  ['会话数', fmtNum(t.sessions)], ['总 Token', fmtNum(t.total)], ['生成调用', fmtNum(t.calls)],
  ['Prompt', fmtNum(t.prompt)], ['Completion', fmtNum(t.completion)],
  ['端到端吞吐', tps({completion: t.completion, duration: t.gen_duration}) + ' tok/s'],
  ['缓存命中率', cacheRate], ['缓存 Token', fmtNum(t.cached)],
  ['推理 Token', fmtNum(t.reasoning)], ['总时长', fmtDur(t.duration)]
];
$('#cards').innerHTML = cards.map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

function seg(el, items, current, onPick){
  el.innerHTML = items.map(([k, label]) => `<button data-k="${k}" class="${k === current ? 'on' : ''}">${label}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => onPick(b.dataset.k));
}

const METRICS = {
  total:    { label: 'Token', get: d => d.total },
  sessions: { label: '会话数', get: d => d.sessions },
  calls:    { label: '调用数', get: d => d.calls },
  cached:   { label: '缓存 Token', get: d => d.cached }
};
const RANGES = [[0, '全部'], [90, '近 90 天'], [30, '近 30 天'], [7, '近 7 天']];
let curMetric = 'total', curRange = 0, curModelMetric = 'total';

function bindMetric(){
  seg($('#metricSeg'), Object.entries(METRICS).map(([k, v]) => [k, v.label]), curMetric, k => {
    curMetric = k; bindMetric(); drawLine();
  });
}
function bindRange(){
  seg($('#rangeSeg'), RANGES, String(curRange), k => {
    curRange = Number(k); bindRange(); drawLine();
  });
}
bindMetric(); bindRange();

function bindModelSeg(){
  seg($('#modelSeg'), [['total', 'Token'], ['calls', '调用'], ['duration', '耗时']], curModelMetric, k => {
    curModelMetric = k; bindModelSeg(); drawModel();
  });
}
bindModelSeg();

function daysSlice(){
  const days = Object.entries(DATA.by_day).sort((a, b) => a[0] < b[0] ? -1 : 1);
  if(!curRange || !days.length) return days;
  const last = new Date(days[days.length - 1][0] + 'T00:00:00');
  const from = new Date(last.getTime() - (curRange - 1) * 86400000).toISOString().slice(0, 10);
  return days.filter(([d]) => d >= from);
}

function drawLine(){
  const days = daysSlice(), metric = METRICS[curMetric];
  const vals = days.map(([d, v]) => metric.get(v));
  const labels = days.map(([d]) => d);
  const el = $('#lineChart');
  if(!vals.length){ el.innerHTML = '<p class="empty">无数据</p>'; return; }
  const W = 1100, H = 330, pl = 72, pr = 24, pt = 24, pb = 58;
  const w = W - pl - pr, h = H - pt - pb, max = Math.max(...vals) || 1;
  const n = vals.length, step = w / Math.max(n - 1, 1);
  const pts = vals.map((v, i) => [pl + i * step, pt + h - (v / max) * h]);
  let grid = '';
  for(let i = 0; i < 5; i++){
    const f = i / 4, y = pt + h - f * h;
    grid += `<line x1="${pl}" y1="${y}" x2="${pl + w}" y2="${y}" stroke="${css('--border')}"/>` +
            `<text x="${pl - 8}" y="${y + 4}" text-anchor="end" class="ax">${fmtNum(Math.round(max * f))}</text>`;
  }
  let ticks = '', every = Math.max(1, Math.floor(n / 12));
  labels.forEach((l, i) => {
    if(i % every === 0 || i === n - 1){
      const x = pl + i * step;
      ticks += `<text x="${x}" y="${H - 24}" text-anchor="middle" class="ax" transform="rotate(-30 ${x} ${H - 24})">${l.slice(5)}</text>`;
    }
  });
  const line = pts.map(p => p.join(',')).join(' ');
  const dots = pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" class="dot"><title>${labels[i]}: ${fmtNum(vals[i])}</title></circle>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="chart">${grid}` +
    `<polyline points="${line}" fill="none" stroke="${css('--accent')}" stroke-width="2.5" stroke-linejoin="round"/>` +
    `${dots}<rect id="hit" x="${pl}" y="${pt}" width="${w}" height="${h}" fill="transparent"/>${ticks}</svg>` +
    `<div class="tip" id="tip"></div>`;
  const svg = el.querySelector('svg'), hit = el.querySelector('#hit'), tip = el.querySelector('#tip');
  hit.addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect();
    const sx = (e.clientX - r.left) / r.width * W;
    let i = Math.round((sx - pl) / step);
    i = Math.max(0, Math.min(n - 1, i));
    const p = pts[i];
    tip.style.display = 'block';
    tip.style.left = (p[0] / W * 100) + '%';
    tip.style.top = (p[1] / H * 100) + '%';
    tip.textContent = `${labels[i]}  ${metric.label}: ${fmtNum(vals[i])}`;
  });
  hit.addEventListener('mouseleave', () => tip.style.display = 'none');
}

function barSVG(rows, color, formatter){
  if(!rows.length) return '<p class="empty">无数据</p>';
  const pl = 200, pr = 95, bh = 25, gap = 11, W = 700;
  const w = W - pl - pr, H = rows.length * (bh + gap) + 24;
  const max = Math.max(...rows.map(r => r[1])) || 1;
  let s = '';
  rows.forEach(([label, val], i) => {
    const y = 12 + i * (bh + gap), bw = Math.max(2, val / max * w);
    const shown = formatter(val);
    s += `<text x="${pl - 10}" y="${y + 17}" text-anchor="end" class="rowlab">${esc(label)}</text>` +
         `<rect x="${pl}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${color}"><title>${esc(label)}: ${shown || fmtNum(val)}</title></rect>` +
         (shown ? `<text x="${pl + bw + 8}" y="${y + 17}" class="rowval">${shown}</text>` : '');
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg>`;
}

function drawModel(){
  const models = Object.entries(DATA.by_model)
    .filter(([m, v]) => v.total >= 1e6)
    .sort((a, b) => (b[1][curModelMetric] || 0) - (a[1][curModelMetric] || 0)).slice(0, 15)
    .map(([m, v]) => [m.split('/').pop(), v[curModelMetric] || 0]);
  const fmt = curModelMetric === 'duration' ? fmtDur
            : curModelMetric === 'total' ? v => (v / 1e6).toFixed(2) + 'M'
            : fmtNum;
  $('#modelChart').innerHTML = barSVG(models, css('--purple'), fmt);
}

function drawSpan(){
  const spans = DATA.by_span.slice().sort((a, b) => b.duration - a.duration).slice(0, 15)
    .map(s => [`${s.name} [${s.type}]`, s.duration]);
  $('#spanChart').innerHTML = barSVG(spans, css('--orange'), fmtDur);
}

function drawCharts(){ drawLine(); drawModel(); drawSpan(); }

function exportCSV(cols, rows, name){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [cols.map(c => q(c.label)).join(',')]
    .concat(rows.map(r => cols.map(c => q(r[c.key])).join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function makeTable(mountId, cols, rows, searchId){
  const state = {key: cols[0].key, dir: -1, q: ''};
  function render(){
    let data = rows.slice();
    if(state.q){
      const q = state.q.toLowerCase();
      data = data.filter(r => cols.some(c => String(r[c.key] == null ? '' : r[c.key]).toLowerCase().includes(q)));
    }
    data.sort((a, b) => {
      const x = a[state.key], y = b[state.key];
      if(typeof x === 'number' && typeof y === 'number') return (x - y) * state.dir;
      return String(x).localeCompare(String(y)) * state.dir;
    });
    const head = cols.map(c => `<th data-k="${c.key}" class="${c.num ? 'n' : ''} ${c.key === state.key ? 'sorted' : ''}">${c.label}<span class="sort">${c.key === state.key ? (state.dir < 0 ? '▼' : '▲') : ''}</span></th>`).join('');
    const body = data.map(r => '<tr>' + cols.map(c => {
      const v = c.fmt ? c.fmt(r[c.key], r) : esc(r[c.key] == null ? '' : r[c.key]);
      return `<td class="${c.num ? 'n' : ''}">${v}</td>`;
    }).join('') + '</tr>').join('');
    $(mountId).innerHTML = `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>` +
      (body || `<tr><td colspan="${cols.length}" class="empty">无匹配</td></tr>`) +
      `</tbody></table></div><div class="tfoot">显示 ${data.length} / ${rows.length} 行 · <button class="lnk exp">导出 CSV</button></div>`;
    $$(mountId + ' th').forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      if(state.key === k) state.dir *= -1;
      else { state.key = k; state.dir = -1; }
      render();
    });
    $(mountId + ' .exp').onclick = () => exportCSV(cols, data, mountId.slice(1));
  }
  $(searchId).oninput = e => { state.q = e.target.value.trim(); render(); };
  render();
}

const modelRows = Object.entries(DATA.by_model).map(([m, v]) => ({
  model: m.split('/').pop(), ...v,
  uncached: Math.max(0, v.prompt - v.cached),
  cacheRate: v.prompt ? v.cached / v.prompt * 100 : 0,
  tps: v.duration > 0 ? v.completion / (v.duration / 1000) : 0
}));
makeTable('#modelTable', [
  {key:'model', label:'模型'}, {key:'calls', label:'调用', num:true},
  {key:'prompt', label:'Prompt', num:true, fmt:fmtNum}, {key:'completion', label:'Completion', num:true, fmt:fmtNum},
  {key:'cached', label:'缓存', num:true, fmt:fmtNum},
  {key:'uncached', label:'未缓存输入', num:true, fmt:fmtNum},
  {key:'cacheRate', label:'缓存比例', num:true, fmt:v => v.toFixed(1) + '%'},
  {key:'reasoning', label:'推理', num:true, fmt:fmtNum},
  {key:'total', label:'合计', num:true, fmt:fmtNum}, {key:'duration', label:'耗时', num:true, fmt:fmtDur},
  {key:'tps', label:'吞吐(tok/s)', num:true, fmt:v => Number(v).toFixed(1)}
], modelRows, '#modelSearch');

const spanRows = DATA.by_span.map(s => ({...s, avg: Math.floor(s.duration / Math.max(s.count, 1))}));
makeTable('#spanTable', [
  {key:'name', label:'名称'}, {key:'type', label:'类型'}, {key:'count', label:'次数', num:true},
  {key:'duration', label:'总耗时', num:true, fmt:fmtDur}, {key:'avg', label:'均耗时', num:true, fmt:fmtDur}
], spanRows, '#spanSearch');

const dayRows = Object.entries(DATA.by_day).map(([day, v]) => ({day, ...v}));
makeTable('#dayTable', [
  {key:'day', label:'日期'}, {key:'sessions', label:'会话', num:true}, {key:'calls', label:'调用', num:true},
  {key:'prompt', label:'Prompt', num:true, fmt:fmtNum}, {key:'completion', label:'Completion', num:true, fmt:fmtNum},
  {key:'cached', label:'缓存', num:true, fmt:fmtNum}, {key:'total', label:'合计', num:true, fmt:fmtNum}
], dayRows, '#daySearch');

makeTable('#sessionTable', [
  {key:'at', label:'时间'}, {key:'day', label:'日期'},
  {key:'spans', label:'Span 数', num:true}, {key:'duration', label:'时长', num:true, fmt:fmtDur}
], DATA.sessions, '#sessionSearch');

$('#exportAllBtn').onclick = () => exportCSV([
  {key:'day', label:'日期'}, {key:'sessions', label:'会话'}, {key:'calls', label:'调用'},
  {key:'prompt', label:'Prompt'}, {key:'completion', label:'Completion'},
  {key:'cached', label:'缓存'}, {key:'total', label:'合计'}
], dayRows.slice().sort((a, b) => a.day < b.day ? 1 : -1), '每日明细');

drawCharts();
</script>
</body>
</html>
